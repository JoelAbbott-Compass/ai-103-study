<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#141E27" />
<title>AI-103 Study App</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />

<!-- Rajdhani (Compass secondary font for headings/key elements): preconnect +
     preload + async swap; offline/file:// falls back to the metric-matched
     Arial face below with no layout jump. -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap"
      media="print" onload="this.media='all'" />
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" /></noscript>

<style>
  /* ==========================================================================
     TOKENS - the only place raw hex may appear (brand-lint enforces this).
     Every color has one job. Type scale: Major Third, 16px base.
     ========================================================================== */
  :root{
    /* brand - the FOUR official Compass colors (brand guide: Onyx, Slate,
       Orange, Lime) plus white. These five are the ONLY raw color values in
       the app; every other color is a color-mix() of two of them (tint =
       brand + white, shade/text = brand + onyx). brand-lint (W5) enforces. */
    --onyx:#141E27;    /* chrome, headings, dark surfaces */
    --slate:#323E48;   /* structure, labels, and the calm "wrong answer" state */
    --orange:#F47820;  /* the one thing that matters: primary action, active, attention */
    --lime:#78B543;    /* the brand green: correct / success */
    /* derived brand shades */
    --onyx-light:color-mix(in srgb, var(--onyx) 94%, #fff);      /* raised element on dark */
    --orange-dark:color-mix(in srgb, var(--orange) 78%, var(--onyx)); /* pressed edge, hover */
    /* neutral ramp - slate tints, light to dark */
    --n50:color-mix(in srgb, var(--slate) 3%, #fff);
    --n100:color-mix(in srgb, var(--slate) 7%, #fff);
    --n200:color-mix(in srgb, var(--slate) 13%, #fff);
    --n300:color-mix(in srgb, var(--slate) 23%, #fff);
    --n500:color-mix(in srgb, var(--slate) 72%, #fff);
    /* state tints (brand + white) for option/feedback backgrounds */
    --orange-bg:color-mix(in srgb, var(--orange) 8%, #fff);
    --lime-bg:color-mix(in srgb, var(--lime) 14%, #fff);
    --slate-bg:color-mix(in srgb, var(--slate) 8%, #fff);
    /* state text shades - pass WCAG AA on white (lime-text 4.5:1+, slate 7.5:1+) */
    --lime-text:color-mix(in srgb, var(--lime) 55%, var(--onyx));
    /* type */
    --font:Arial,'Helvetica Neue',sans-serif;
    --font-head:'Rajdhani','Rajdhani Fallback',Arial,sans-serif;
    --fs-13:13px; --fs-16:16px; --fs-20:20px; --fs-25:25px; --fs-31:31px; --fs-39:39px;
    /* shape + motion */
    --radius:12px; --radius-btn:10px;
    --ease:cubic-bezier(.4,0,.2,1);
    --t-micro:150ms; --t-move:250ms; --t-big:400ms;
    --shadow-float:0 8px 24px color-mix(in srgb, var(--onyx) 16%, transparent); /* sheets + modals ONLY */
  }

  /* Metric-matched fallback so file:// and offline render headings at
     Rajdhani's width with plain Arial - no swap jump. */
  @font-face{
    font-family:'Rajdhani Fallback';
    src:local('Arial');
    size-adjust:96%; line-gap-override:0%;
  }

  /* ==========================================================================
     BASE
     ========================================================================== */
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;font-family:var(--font);font-size:var(--fs-16);line-height:1.55;
       color:var(--onyx);background:var(--n50);}
  /* Brand watermark: the compass mark (no wordmark) sits faintly behind every
     view. The asset file is untouched - transparency lives here in CSS only.
     position:fixed pseudo-element on purpose: background-attachment:fixed is
     broken on iOS Safari, this works on the phone. Content layers above it. */
  body::before{content:"";position:fixed;z-index:0;pointer-events:none;
      right:-14vmin;bottom:-10vmin;width:74vmin;height:87vmin;
      background:url("compass-mark.svg") no-repeat center / contain;
      opacity:.06;}
  h1,h2,h3{font-family:var(--font-head);font-weight:700;color:var(--onyx);line-height:1.2;
           margin:0 0 12px;}
  h1{font-size:var(--fs-25);}
  h2{font-size:var(--fs-20);}
  h3{font-size:var(--fs-20);}
  p{margin:0 0 12px;}
  button{font-family:var(--font);}
  .muted{color:var(--n500);}
  .small{font-size:var(--fs-13);}
  .danger{color:var(--slate);} .good{color:var(--lime-text);}
  .warn{color:var(--orange-dark);} .bad{color:var(--slate);}
  .num,.kpi-val,.bar-pct,.mock-pct,.done-score,.timer{font-variant-numeric:tabular-nums;}

  :focus-visible{outline:2px solid var(--orange);outline-offset:2px;border-radius:4px;}

  .icon{width:24px;height:24px;flex:none;}

  /* ==========================================================================
     HEADER (onyx chrome, white logo 40px)
     ========================================================================== */
  /* relative + z-index so header/main stack above the fixed watermark */
  header{background:var(--onyx);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:16px;
      border-bottom:3px solid var(--orange);position:relative;z-index:1;}
  header img{height:40px;}
  header .app-title{font-family:var(--font-head);font-weight:700;font-size:var(--fs-16);}
  header .app-sub{color:rgba(255,255,255,.6);font-size:var(--fs-13);}
  /* exam countdown chip: white/orange on onyx (orange on onyx is ~5.8:1, passes AA) */
  .exam-chip{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none;
      background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);
      border-radius:99px;padding:8px 14px;
      font-family:var(--font-head);font-weight:600;font-size:var(--fs-13);
      letter-spacing:.04em;text-transform:uppercase;color:rgba(255,255,255,.85);
      font-variant-numeric:tabular-nums;}
  .exam-chip .icon{width:16px;height:16px;color:var(--orange);}
  .exam-chip strong{color:var(--orange);font-size:var(--fs-16);}
  @media(max-width:519px){ .exam-chip .chip-word{display:none;} }

  /* ==========================================================================
     NAV - bottom tab bar on phones, top nav in the header band on desktop
     ========================================================================== */
  nav{position:fixed;bottom:0;left:0;right:0;z-index:20;
      background:#fff;border-top:1px solid var(--n200);
      display:flex;justify-content:space-around;
      padding:4px 8px calc(4px + env(safe-area-inset-bottom));}
  .nav-btn{background:transparent;border:none;cursor:pointer;
      display:flex;flex-direction:column;align-items:center;gap:2px;
      min-width:56px;min-height:48px;padding:6px 8px;border-radius:8px;
      color:var(--slate);}
  .nav-btn .icon{width:24px;height:24px;}
  .nav-label{font-family:var(--font-head);font-weight:600;font-size:11px;
      letter-spacing:.06em;text-transform:uppercase;}
  /* active tab: orange-dark icon (>3:1 on white), onyx label (11px text must pass 4.5:1) */
  .nav-btn.active{color:var(--orange-dark);}
  .nav-btn.active .icon{stroke-width:2.5;}
  .nav-btn.active .nav-label{color:var(--onyx);}

  main{max-width:860px;margin:0 auto;position:relative;z-index:1;
       padding:24px 16px calc(96px + env(safe-area-inset-bottom));}

  @media(min-width:768px){
    /* keyline moves below the nav so header+nav read as one masthead */
    header{border-bottom:none;}
    nav{position:sticky;top:0;bottom:auto;background:var(--onyx-light);border-top:none;
        border-bottom:3px solid var(--orange);
        justify-content:flex-start;gap:4px;padding:0 16px;}
    .nav-btn{flex-direction:row;gap:8px;min-height:48px;padding:12px 14px;border-radius:0;
        color:rgba(255,255,255,.6);border-bottom:3px solid transparent;}
    .nav-btn .icon{width:20px;height:20px;}
    .nav-btn:hover{color:#fff;}
    .nav-btn.active{color:#fff;border-bottom-color:var(--orange);}
    .nav-btn.active .icon{stroke-width:2.5;color:var(--orange);}
    .nav-btn.active .nav-label{color:#fff;}
    main{padding:32px 24px 64px;}
  }

  /* ==========================================================================
     SURFACES - one elevation language: white card, 1px border, 12px radius,
     no shadow. Shadows are reserved for sheets/modals (--shadow-float).
     ========================================================================== */
  .card{background:#fff;border:1px solid var(--n200);border-radius:var(--radius);padding:16px;}

  /* brand-tinted icon chips + tone classes (tint = brand + white, text = AA-safe shade) */
  .tone-orange{background:var(--orange-bg);color:var(--orange-dark);}
  .tone-lime{background:var(--lime-bg);color:var(--lime-text);}
  .tone-slate{background:var(--slate-bg);color:var(--slate);}
  .chip{width:30px;height:30px;border-radius:8px;display:inline-flex;
      align-items:center;justify-content:center;flex:none;}
  .chip .icon{width:18px;height:18px;}

  /* ==========================================================================
     JARGON EXPLAINERS - tap a small "?" to open a designed panel in place.
     Click-toggled (works on touch), never hover-only, one open per surface.
     ========================================================================== */
  .info-btn{background:transparent;border:none;cursor:pointer;color:var(--n500);
      width:28px;height:28px;padding:0;border-radius:99px;position:relative;
      display:inline-flex;align-items:center;justify-content:center;flex:none;vertical-align:middle;}
  .info-btn .icon{width:17px;height:17px;}
  .info-btn::after{content:"";position:absolute;inset:-8px;} /* 44px touch target */
  .info-btn:hover,.info-btn[aria-expanded="true"]{color:var(--orange-dark);background:var(--orange-bg);}
  .how-btn{display:inline-flex;align-items:center;gap:6px;background:transparent;border:none;
      cursor:pointer;color:var(--slate);font-family:var(--font-head);font-weight:600;
      font-size:var(--fs-13);letter-spacing:.05em;text-transform:uppercase;
      padding:8px 10px;min-height:36px;border-radius:8px;align-self:flex-start;}
  .how-btn .icon{width:16px;height:16px;}
  .how-btn:hover,.how-btn[aria-expanded="true"]{background:var(--slate-bg);}
  .explain{background:var(--slate-bg);border-left:3px solid var(--slate);
      border-radius:0 10px 10px 0;padding:12px 14px;margin:10px 0 4px;
      font-size:var(--fs-13);line-height:1.55;color:var(--slate);text-align:left;
      font-family:var(--font);font-weight:400;text-transform:none;letter-spacing:normal;}
  .explain-term{display:block;font-family:var(--font-head);font-weight:700;font-size:var(--fs-13);
      letter-spacing:.05em;text-transform:uppercase;color:var(--onyx);margin-bottom:4px;}
  @media (prefers-reduced-motion: no-preference){
    .explain{animation:explainIn var(--t-micro) var(--ease);}
    @keyframes explainIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  }

  /* KPI strip */
  .hero{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:24px;}
  @media(min-width:640px){.hero{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;}}
  .kpi-head{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .kpi-title-wrap{display:flex;align-items:center;gap:2px;min-width:0;}
  .kpi-title{font-family:var(--font-head);font-weight:600;font-size:11px;
      text-transform:uppercase;letter-spacing:.06em;color:var(--slate);}
  .kpi-val{font-weight:700;font-size:var(--fs-31);line-height:1.15;margin:4px 0 2px;}
  .kpi-sub{font-size:var(--fs-13);}

  /* bars */
  .bar{background:var(--n200);border-radius:99px;height:8px;overflow:hidden;margin-top:8px;}
  .bar-fill{height:100%;background:var(--orange);border-radius:99px;}
  @media (prefers-reduced-motion: no-preference){ .bar-fill{transition:width var(--t-move) var(--ease);} }
  .bar-fill.good{background:var(--lime);} .bar-fill.warn{background:var(--orange);} .bar-fill.bad{background:var(--slate);}
  .bar-wrap{display:flex;align-items:center;gap:10px;}
  .bar-inline{flex:1;margin-top:0;}
  .bar-pct{min-width:42px;text-align:right;font-size:var(--fs-13);}

  /* Study-now panel (solid onyx, no gradient) */
  .studynow{background:var(--onyx);color:#fff;border-radius:var(--radius);
      padding:24px;margin-bottom:24px;display:flex;align-items:center;justify-content:space-between;
      flex-wrap:wrap;gap:16px;}
  .studynow h2{color:#fff;margin:0 0 4px;}
  .studynow .muted{color:rgba(255,255,255,.6);}

  .shortcuts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;}
  .shortcut{text-align:left;background:#fff;border:1px solid var(--n200);border-radius:var(--radius);
      padding:16px;cursor:pointer;font-size:var(--fs-16);color:var(--onyx);
      display:flex;gap:12px;align-items:flex-start;}
  .shortcut:hover{border-color:var(--orange);}
  .shortcut:disabled{opacity:.45;cursor:not-allowed;}
  .shortcut:disabled:hover{border-color:var(--n200);}
  .sc-title{font-family:var(--font-head);font-weight:700;margin-bottom:2px;}
  .sc-sub{font-size:var(--fs-13);}

  /* pill selectors (domain drill, mock length) */
  .pill{border:1px solid var(--n300);background:#fff;border-radius:99px;
      padding:8px 16px;min-height:36px;font-size:var(--fs-13);font-weight:700;
      cursor:pointer;color:var(--onyx);font-family:var(--font);}
  .pill:hover{border-color:var(--orange);}
  .pill.on{background:var(--onyx);color:#fff;border-color:var(--onyx);}

  /* ==========================================================================
     BUTTONS - tactile press: darker bottom edge that collapses on :active
     ========================================================================== */
  .btn{font-family:var(--font);font-weight:700;font-size:var(--fs-16);
      background:#fff;color:var(--onyx);border:1px solid var(--n300);
      border-radius:var(--radius-btn);padding:10px 16px;min-height:44px;cursor:pointer;
      box-shadow:0 2px 0 var(--n200);}
  .btn:hover{border-color:var(--slate);}
  .btn:active{transform:translateY(2px);box-shadow:none;}
  @media (prefers-reduced-motion: no-preference){ .btn{transition:transform 100ms var(--ease),box-shadow 100ms var(--ease),background 100ms var(--ease);} }
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  /* onyx label: white on #F47820 is ~2.8:1 and fails AA even for large text */
  .btn-primary{background:var(--orange);border-color:var(--orange-dark);color:var(--onyx);
      box-shadow:0 3px 0 var(--orange-dark);}
  .btn-primary:hover{background:var(--orange-dark);}
  .btn-primary:active{transform:translateY(3px);box-shadow:none;}
  .btn-lg{padding:14px 24px;font-size:var(--fs-16);}
  .btn-danger{color:var(--slate);}
  .btn.nudge{border-color:var(--slate);color:var(--slate);}
  .filters{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0;}

  /* ==========================================================================
     QUESTION RUNNER
     ========================================================================== */
  .runner-prog{margin-bottom:10px;font-size:var(--fs-13);}
  .qcard{padding:20px;}
  .qtags{font-size:var(--fs-13);margin-bottom:8px;}
  .qstem{font-size:var(--fs-20);line-height:1.4;margin-bottom:16px;font-weight:700;
      font-family:var(--font-head);}
  .opts{display:flex;flex-direction:column;gap:10px;}
  .opt{text-align:left;background:var(--n50);border:1.5px solid var(--n200);border-radius:var(--radius-btn);
      padding:12px 14px;min-height:44px;cursor:pointer;font-size:var(--fs-16);font-family:var(--font);color:var(--onyx);}
  .opt:hover{border-color:var(--slate);}
  .opt.picked{border-color:var(--orange);background:var(--orange-bg);}
  .opt.correct{border-color:var(--lime);background:var(--lime-bg);}
  .opt.wrong{border-color:var(--slate);background:var(--slate-bg);}
  .conf{display:flex;align-items:center;gap:8px;margin:16px 0 4px;flex-wrap:wrap;}
  .conf-label{font-size:var(--fs-13);}
  .conf-btn{border:1px solid var(--n300);background:#fff;border-radius:99px;
      padding:8px 14px;min-height:36px;font-size:var(--fs-13);cursor:pointer;text-transform:capitalize;}
  .conf-btn.on{background:var(--onyx);color:#fff;border-color:var(--onyx);}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;}
  .feedback{margin-top:16px;} .feedback:empty{margin:0;}
  .feedback.ok .fb-head{color:var(--lime-text);} .feedback.no .fb-head{color:var(--slate);}
  .fb-head{font-family:var(--font-head);font-weight:700;font-size:var(--fs-20);margin-bottom:8px;}
  .fb-line{margin:6px 0;line-height:1.55;} .fb-label{font-weight:700;}
  .order-answer{margin-top:12px;padding:10px;background:var(--lime-bg);border-radius:8px;font-size:var(--fs-13);}

  /* Answer feedback bottom sheet (one of the two places a shadow is allowed) */
  .answer-sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;
      border-top:4px solid var(--n300);box-shadow:var(--shadow-float);
      padding:16px 16px calc(16px + env(safe-area-inset-bottom));
      transform:translateY(100%);}
  @media (prefers-reduced-motion: no-preference){
    .answer-sheet{transition:transform var(--t-move) var(--ease);}
  }
  .answer-sheet.open{transform:translateY(0);}
  .answer-sheet.ok{border-top-color:var(--lime);}
  .answer-sheet.no{border-top-color:var(--slate);}
  .as-inner{max-width:860px;margin:0 auto;}
  .as-head{display:flex;align-items:center;gap:10px;font-family:var(--font-head);
      font-weight:700;font-size:var(--fs-20);margin-bottom:8px;}
  .answer-sheet.ok .as-head{color:var(--lime-text);}
  .answer-sheet.no .as-head{color:var(--slate);}
  .as-head .icon{width:28px;height:28px;}
  .as-actions{margin-top:14px;display:flex;justify-content:flex-end;}

  /* ==========================================================================
     FLASHCARDS
     ========================================================================== */
  /* full-stage 3D flip: perspective parent, preserve-3d inner, two stacked faces */
  .fc-stage{perspective:1000px;max-width:640px;margin:0 auto;cursor:pointer;
      -webkit-tap-highlight-color:transparent;}
  .fc-inner{position:relative;min-height:280px;transform-style:preserve-3d;}
  @media (prefers-reduced-motion: no-preference){
    .fc-inner{transition:transform var(--t-big) var(--ease);}
  }
  .fc-inner.flipped{transform:rotateY(180deg);}
  .fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
      background:#fff;border:1px solid var(--n200);border-radius:var(--radius);
      padding:24px;display:flex;flex-direction:column;justify-content:center;
      text-align:center;overflow-y:auto;}
  .fc-face.back{transform:rotateY(180deg);}
  .fc-front{font-size:var(--fs-20);font-weight:700;line-height:1.4;font-family:var(--font-head);}
  .fc-back-text{font-size:var(--fs-16);line-height:1.55;color:var(--slate);}
  .fc-hint{text-align:center;margin-top:10px;font-size:var(--fs-13);color:var(--n500);}
  .fc-actions{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap;}
  .rate-again{color:var(--slate);} .rate-hard{color:var(--orange-dark);} .rate-good{color:var(--lime-text);}

  /* ==========================================================================
     GUIDES
     ========================================================================== */
  .guide-list{display:grid;gap:12px;}
  .guide-item{display:flex;align-items:flex-start;gap:14px;text-align:left;background:#fff;
      border:1px solid var(--n200);border-radius:var(--radius);
      padding:16px;cursor:pointer;font-size:var(--fs-16);color:var(--onyx);}
  .guide-item:hover{border-color:var(--orange);}
  .gi-txt{flex:1;min-width:0;}
  .gi-title{font-family:var(--font-head);font-weight:700;font-size:var(--fs-16);}
  .gi-sub{font-size:var(--fs-13);margin-top:2px;}
  .gi-badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  .gbadge{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-13);font-weight:700;
      padding:4px 10px;border-radius:99px;}
  .gbadge .icon{width:14px;height:14px;}
  .gbadge.tone-orange{background:var(--orange-bg);color:var(--orange-dark);}
  .gbadge.tone-slate{background:var(--slate-bg);color:var(--slate);}
  .gbadge.tone-lime{background:var(--lime-bg);color:var(--lime-text);}
  .gi-chev{color:var(--n300);margin-top:2px;display:flex;}
  .gi-desc{margin:6px 0 0;font-size:var(--fs-13);color:var(--slate);line-height:1.5;max-width:68ch;}
  .gmeta{margin:-6px 0 2px;}
  .gdesc{color:var(--slate);max-width:68ch;margin:4px 0 14px;}
  .gfoot{margin-top:20px;max-width:68ch;}
  .quizme{display:inline-flex;align-items:center;gap:8px;margin:4px 0 8px;}
  .quizme .icon{width:18px;height:18px;}
  .guide-h2{margin:16px 0 4px;}

  /* sticky "On this page" nav */
  .toc{position:sticky;top:0;z-index:5;display:flex;gap:8px;overflow-x:auto;
      padding:10px 0;margin:8px 0 4px;background:var(--n50);
      border-bottom:1px solid var(--n200);-webkit-overflow-scrolling:touch;}
  .toc-btn{flex:none;font-family:var(--font-head);font-weight:600;font-size:var(--fs-13);
      letter-spacing:.02em;color:var(--slate);background:#fff;border:1px solid var(--n200);
      border-radius:99px;padding:7px 14px;cursor:pointer;}
  .toc-btn:hover{border-color:var(--orange);color:var(--onyx);}

  /* guide sections: one card language, each kind designed */
  .gsec{background:#fff;border:1px solid var(--n200);border-radius:var(--radius);
      margin:14px 0;scroll-margin-top:64px;overflow:hidden;}
  .gsec-head{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
      background:none;border:0;padding:14px 16px;cursor:pointer;color:var(--onyx);}
  .gsec-title{flex:1;font-family:var(--font-head);font-weight:700;font-size:var(--fs-20);}
  .gsec-chev{color:var(--n300);display:flex;transform:rotate(90deg);}
  @media (prefers-reduced-motion: no-preference){.gsec-chev{transition:transform var(--t-micro) var(--ease);}}
  .gsec.closed .gsec-chev{transform:rotate(0deg);}
  .gsec.closed .gsec-body{display:none;}
  .gsec-body{padding:2px 16px 18px;}
  .gsec-note{margin:0 0 10px;}
  .gsec-cap{margin:0 0 12px;max-width:68ch;}
  .gsec-pareto{border-top:3px solid var(--orange);}
  .pareto-list{list-style:none;margin:0;padding:0;max-width:68ch;}

  .pareto-list li+li{border-top:1px solid var(--n100);}

      background:var(--orange);border-radius:2px;}
  .guide-prose{line-height:1.6;max-width:68ch;}
  .guide-prose h4{font-family:var(--font-head);margin:20px 0 8px;}
  .guide-prose ul{padding-left:20px;} .guide-prose li{margin:5px 0;}
  .guide-note{background:var(--n50);border-left:3px solid var(--orange);padding:10px 14px;border-radius:6px;}
  .guide-diagram{background:var(--onyx);color:var(--n200);padding:16px;border-radius:8px;overflow-x:auto;
      font-family:Consolas,Monaco,monospace;font-size:var(--fs-13);line-height:1.4;}
  .trap-row{display:flex;gap:12px;align-items:flex-start;background:var(--orange-bg);
      border:1px solid color-mix(in srgb, var(--orange) 22%, #fff);border-radius:var(--radius-btn);
      padding:12px 14px;margin:0 0 10px;max-width:68ch;}
  .trap-ic{color:var(--orange-dark);display:flex;flex:none;margin-top:1px;}
  .trap-ic .icon{width:19px;height:19px;}
  .mem-row{display:flex;gap:12px;align-items:flex-start;background:var(--n50);
      border:1px solid var(--n100);border-radius:var(--radius-btn);
      padding:12px 14px;margin:0 0 10px;max-width:68ch;}
  .mem-ic{color:var(--slate);display:flex;flex:none;margin-top:1px;}
  .mem-ic .icon{width:18px;height:18px;}
  .review-cards{margin-top:4px;}
  .do-row{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
      background:#fff;border:1px solid var(--n200);border-radius:var(--radius-btn);
      padding:12px 14px;margin:0 0 10px;cursor:pointer;font-size:var(--fs-16);
      color:var(--onyx);max-width:68ch;}
  .do-box{display:flex;align-items:center;justify-content:center;flex:none;width:24px;height:24px;
      border:2px solid var(--n300);border-radius:6px;color:transparent;margin-top:1px;}
  .do-box .icon{width:16px;height:16px;}
  .do-row.done{background:var(--lime-bg);border-color:color-mix(in srgb, var(--lime) 40%, #fff);}
  .do-row.done .do-box{background:var(--lime);border-color:var(--lime);color:var(--onyx);}
  .do-count{margin-top:2px;}

  /* hand-drawn SVG diagrams: scroll sideways on a phone instead of shrinking text */
  .dg-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .dg-scroll svg{min-width:560px;width:100%;height:auto;display:block;}
  .dg-boundary{fill:none;stroke:var(--n300);stroke-width:1.5;stroke-dasharray:6 5;}
  .dg-box{fill:#fff;stroke:var(--n300);stroke-width:1.5;}
  .dg-box-soft{fill:var(--n50);}
  .dg-box-dark{fill:var(--onyx);stroke:var(--onyx);}
  .dg-chip{fill:var(--n50);stroke:var(--n200);}
  .dg-kicker{font-family:var(--font-head);font-weight:700;font-size:15px;letter-spacing:.05em;fill:var(--slate);}
  .dg-title{font-family:var(--font-head);font-weight:700;font-size:16px;fill:var(--onyx);}
  .dg-title-inv{font-family:var(--font-head);font-weight:700;font-size:16px;fill:#fff;}
  .dg-label{font-family:var(--font);font-weight:700;font-size:13px;fill:var(--onyx);}
  .dg-answer{font-family:var(--font);font-weight:700;font-size:13.5px;fill:var(--onyx);}
  .dg-note{font-family:var(--font);font-size:13px;fill:var(--n500);}
  .dg-note-inv{font-family:var(--font);font-size:13px;fill:color-mix(in srgb, #fff 78%, var(--slate));}
  .dg-side{font-family:var(--font);font-size:12.5px;fill:var(--n500);}
  .dg-link{stroke:var(--n300);stroke-width:2;}
  .dg-go{stroke:var(--orange);stroke-width:2.5;}
  .dg-gohead{fill:var(--orange);}
  .dg-pair{stroke:var(--orange);stroke-width:2.5;}
  .dg-pairhead{fill:var(--orange);}

  /* video + the compass-needle spinner (the app's one decorative flourish) */
  .video-wrap{margin:16px 0;background:var(--onyx);border-radius:var(--radius);padding:14px;}
  .video-label{font-family:var(--font-head);font-weight:700;color:#fff;font-size:var(--fs-16);
      margin-bottom:10px;display:flex;align-items:center;gap:8px;}
  .video-label .icon{width:20px;height:20px;}
  .guide-video{width:100%;border-radius:8px;display:block;background:var(--onyx);}
  .video-stage{position:relative;}
  .vid-load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;}
  .cspin{background:#fff;border:1px solid var(--n200);border-radius:50%;width:56px;height:56px;
      display:flex;align-items:center;justify-content:center;}
  .cspin svg{width:34px;height:34px;}
  .cspin-ring{fill:none;stroke:var(--n200);stroke-width:1.6;}
  .cspin-n{fill:var(--orange);} .cspin-s{fill:var(--slate);} .cspin-hub{fill:var(--onyx);}
  .cspin-needle{transform-box:view-box;transform-origin:center;}
  @media (prefers-reduced-motion: no-preference){
    .cspin-needle{animation:cspin-swing 1.4s var(--ease) infinite;}
  }
  @keyframes cspin-swing{
    0%{transform:rotate(0deg);}
    55%{transform:rotate(320deg);}
    100%{transform:rotate(360deg);}
  }
  /* Home: watch-overviews shelf */
  .vshelf{margin-top:24px;}
  .vshelf-row{display:grid;gap:12px;}
  @media(min-width:700px){.vshelf-row{grid-template-columns:1fr 1fr;}}
  .vcard{display:flex;align-items:flex-start;gap:14px;text-align:left;background:#fff;
      border:1px solid var(--n200);border-radius:var(--radius);padding:14px 16px;cursor:pointer;
      font-size:var(--fs-16);color:var(--onyx);}
  .vcard:hover{border-color:var(--orange);}

  /* ==========================================================================
     PROGRESS / SECTIONS
     ========================================================================== */
  /* SVG readiness ring (decision 21): track n200, progress orange, round caps,
     12 o'clock start; the ONE hero metric. Transition gated to reduced-motion. */
  .ringbox{position:relative;flex:none;margin:0 auto;}
  .ring-track{stroke:var(--n200);}
  .ring-prog{stroke:var(--orange);}
  .ring-prog.hit{stroke:var(--lime);}          /* target reached: brand green */
  /* the 85% goal marker: onyx, extends past the track, labeled on large rings */
  .ring-tick{stroke:var(--onyx);stroke-width:2.5;}
  .ring-tick-label{font-family:var(--font-head);font-weight:600;font-size:11px;
      letter-spacing:.03em;fill:var(--slate);}
  @media (prefers-reduced-motion: no-preference){
    .ring-prog{transition:stroke-dashoffset 750ms var(--ease);}
  }
  .ring-num{position:absolute;inset:0;display:flex;flex-direction:column;
      align-items:center;justify-content:center;text-align:center;}
  .ring-val{font-weight:700;line-height:1.1;}
  .ring-sub{font-size:var(--fs-13);}
  .ring-lg .ring-val{font-size:var(--fs-39);}
  .ring-sm .ring-val{font-size:var(--fs-16);}
  .kpi-ring-row{display:flex;margin:6px 0 4px;}

  /* Progress hero: ring + subordinate stats */
  .prog-hero{display:flex;gap:24px;align-items:center;flex-wrap:wrap;
      padding:24px;margin-bottom:24px;}
  .prog-hero .explain{flex-basis:100%;margin-bottom:0;}
  .ph-stats{flex:1;min-width:220px;display:flex;flex-direction:column;gap:10px;}
  .ph-stat{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
      border-bottom:1px solid var(--n100);padding-bottom:8px;}
  .ph-label{font-family:var(--font-head);font-weight:600;font-size:11px;
      text-transform:uppercase;letter-spacing:.06em;color:var(--slate);}
  .ph-val{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;}
  .ph-note{margin:2px 0 0;}

  /* direct-labeled domain bars (decision 22): name left, value right, no legend */
  .dom-row{margin:14px 0;}
  .dom-line{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:5px;}
  .dom-name{font-weight:700;font-size:var(--fs-13);}
  .dom-val{font-size:var(--fs-13);font-variant-numeric:tabular-nums;white-space:nowrap;flex:none;}
  .dom-row .bar{margin-top:0;}
  .flag-note{background:var(--n50);border-left:3px solid var(--orange);
      padding:10px 14px;border-radius:6px;font-size:var(--fs-13);margin-top:14px;}

  .section{margin:32px 0;}
  .section-h{font-size:var(--fs-20);margin-bottom:12px;border-bottom:2px solid var(--n200);padding-bottom:6px;
      display:flex;align-items:center;gap:8px;}
  .sh-icon{display:inline-flex;color:var(--orange-dark);}
  .sh-icon .icon{width:18px;height:18px;}

  /* Flashcards deck hero */
  .deck-hero{margin:16px 0;padding:20px;}
  .deck-top{display:flex;align-items:center;gap:14px;}
  .deck-top .chip{width:44px;height:44px;border-radius:10px;}
  .deck-top .chip .icon{width:24px;height:24px;}
  .deck-due{font-weight:700;font-size:var(--fs-39);line-height:1;font-variant-numeric:tabular-nums;}
  .deck-due-lab{font-size:var(--fs-13);color:var(--n500);}
  .stat-chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0;}
  .stat-chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;
      padding:6px 12px;font-size:var(--fs-13);font-weight:700;font-variant-numeric:tabular-nums;}

  /* 7-day due forecast mini chart */
  .forecast{display:flex;gap:8px;align-items:flex-end;max-width:420px;margin:16px 0 4px;}
  .fcol{flex:1;text-align:center;font-size:var(--fs-13);color:var(--n500);font-variant-numeric:tabular-nums;}
  .fcol-n{font-weight:700;color:var(--slate);}
  .fbar{background:var(--n200);border-radius:6px 6px 2px 2px;margin:2px auto;width:70%;}
  .fcol.today .fbar{background:var(--orange);}
  .fcol.today .fcol-n{color:var(--orange-dark);}
  .forecast-cap{font-size:var(--fs-13);color:var(--n500);margin-bottom:14px;}
  .dbar{margin:10px 0;} .dbar-lab{font-size:var(--fs-13);margin-bottom:5px;} .dbar-name{font-weight:700;}
  .streak-grid{display:grid;grid-template-columns:repeat(15,1fr);gap:4px;max-width:420px;}
  .streak-cell{aspect-ratio:1;background:var(--n200);border-radius:3px;}
  .streak-cell.on{background:var(--lime);}   /* studied = success = brand green */
  .mock-cfg{margin:16px 0;}
  .mock-row{padding:6px 0;}
  .mock-pct{font-weight:700;font-size:var(--fs-20);}
  .timer{background:var(--onyx);color:#fff;font-family:var(--font-head);font-weight:700;
      text-align:center;padding:8px;border-radius:8px;margin-bottom:12px;}
  .timer.warn{background:var(--orange);color:var(--onyx);}
  .done{text-align:center;padding:24px;}
  .done-score{font-weight:700;font-size:var(--fs-39);margin:10px 0 4px;}
  .breakdown{margin:16px 0;text-align:left;}
  .export-area{margin-top:12px;}
  .export-ta{width:100%;height:140px;font-family:Consolas,monospace;font-size:12px;
      border:1px solid var(--n300);border-radius:8px;padding:10px;}

  /* ==========================================================================
     COURSE IDENTITY - names + links the source course; "What you'll learn"
     lists the five exam domains with their real weights (orientation).
     ========================================================================== */
  .course-band{background:var(--onyx);color:#fff;border-radius:var(--radius);
      padding:20px;margin:24px 0;display:flex;gap:14px;align-items:flex-start;}
  .course-band .chip{background:rgba(255,255,255,.08);color:var(--orange);
      width:44px;height:44px;border-radius:10px;}
  .course-band .chip .icon{width:24px;height:24px;}
  .cb-kicker{font-family:var(--font-head);font-weight:600;font-size:11px;
      letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.6);}
  .cb-title{font-family:var(--font-head);font-weight:700;font-size:var(--fs-20);
      line-height:1.25;margin:2px 0 4px;}
  .cb-sub{font-size:var(--fs-13);color:rgba(255,255,255,.6);}
  /* orange on onyx is ~5.8:1 - passes AA for this bold 13px label */
  .cb-link{display:inline-flex;align-items:center;gap:6px;margin-top:10px;
      color:var(--orange);font-weight:700;font-size:var(--fs-13);text-decoration:none;
      min-height:24px;}

  .cb-link .icon{width:15px;height:15px;}

  .learn-row{padding:10px 0;border-bottom:1px solid var(--n100);}
  .learn-row:last-of-type{border-bottom:none;padding-bottom:4px;}
  .learn-line{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:5px;}
  .learn-name{font-weight:700;font-size:var(--fs-16);}
  .learn-val{font-size:var(--fs-13);color:var(--n500);white-space:nowrap;flex:none;
      font-variant-numeric:tabular-nums;}
  .learn-row .bar{margin-top:0;height:6px;}

  /* designed empty states: value + next action, never bare "No data" */
  .empty{text-align:center;padding:40px 16px;}
  .empty .icon{width:32px;height:32px;color:var(--slate);}
  .empty-title{font-family:var(--font-head);font-weight:700;font-size:var(--fs-20);
      margin:10px 0 4px;color:var(--onyx);}
  .empty-sub{color:var(--n500);max-width:44ch;margin:0 auto 16px;}

  @media(max-width:520px){ .kpi-val{font-size:var(--fs-25);} }
</style>
