<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI-103 Study App</title>
<style>
  :root{
    --orange:#EA7826; --orange-dark:#C85F15; --orange-light:#F68E1E;
    --navy:#141E27; --navy-light:#1E2C38; --slate:#455661;
    --n50:#F9FAFB; --n100:#F3F4F6; --n200:#E5E7EB; --n300:#D1D5DB;
    --n400:#9CA3AF; --n500:#6B7280; --n600:#4B5563; --n700:#374151; --n900:#111827;
    --success:#10B981; --warning:#F59E0B; --error:#EF4444;
    --font:Arial,'Helvetica Neue',sans-serif;
    --font-head:'Montserrat',Arial,sans-serif;
    --radius:12px; --shadow:0 1px 3px rgba(20,30,39,.08),0 1px 2px rgba(20,30,39,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font);color:var(--navy);background:var(--n100);}
  h1,h2,h3{font-family:var(--font-head);font-weight:700;color:var(--navy);}
  .muted{color:var(--n500);} .small{font-size:.85rem;} .danger{color:var(--error);}
  .good{color:var(--success);} .warn{color:var(--warning);} .bad{color:var(--error);}

  header{background:var(--navy);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:16px;}
  header img{height:40px;}
  header .app-title{font-family:var(--font-head);font-weight:700;font-size:1.05rem;letter-spacing:.02em;}
  header .app-sub{color:#9fb0bd;font-size:.8rem;}

  nav{background:var(--navy-light);display:flex;gap:2px;padding:0 12px;position:sticky;top:0;z-index:5;
      overflow-x:auto;box-shadow:var(--shadow);}
  .nav-btn{background:transparent;border:none;color:#c7d2da;font-family:var(--font-head);font-weight:600;
      padding:12px 16px;cursor:pointer;font-size:.9rem;border-bottom:3px solid transparent;white-space:nowrap;}
  .nav-btn:hover{color:#fff;}
  .nav-btn.active{color:#fff;border-bottom-color:var(--orange);}

  #view{max-width:860px;margin:0 auto;padding:22px 18px 60px;}
  .view h1,.view-home h1{font-size:1.5rem;margin:.2rem 0 1rem;}

  .card{background:#fff;border:1px solid var(--n200);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);}
  .hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px;}
  .kpi{text-align:left;} .kpi-title{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--n500);font-weight:700;}
  .kpi-val{font-family:var(--font-head);font-weight:700;font-size:2rem;line-height:1.1;margin:.15rem 0;}
  .kpi-sub{font-size:.8rem;}

  .bar{background:var(--n200);border-radius:99px;height:8px;overflow:hidden;margin-top:8px;}
  .bar-fill{height:100%;background:var(--orange);border-radius:99px;transition:width .3s;}
  .bar-fill.good{background:var(--success);} .bar-fill.warn{background:var(--warning);} .bar-fill.bad{background:var(--error);}
  .bar-wrap{display:flex;align-items:center;gap:10px;} .bar-inline{flex:1;margin-top:0;} .bar-pct{min-width:38px;text-align:right;font-size:.8rem;}

  .studynow{background:linear-gradient(135deg,var(--navy),var(--navy-light));color:#fff;border-radius:var(--radius);
      padding:22px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;}
  .studynow h2{color:#fff;margin:0 0 4px;} .studynow .muted{color:#9fb0bd;}
  .shortcuts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;}
  .shortcut{text-align:left;background:#fff;border:1px solid var(--n200);border-radius:var(--radius);padding:16px;cursor:pointer;box-shadow:var(--shadow);}
  .shortcut:hover{border-color:var(--orange);} .sc-title{font-family:var(--font-head);font-weight:700;margin-bottom:2px;}

  .btn{font-family:var(--font-head);font-weight:600;background:#fff;color:var(--navy);border:1px solid var(--n300);
      border-radius:9px;padding:10px 16px;cursor:pointer;font-size:.9rem;}
  .btn:hover{border-color:var(--slate);} .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn-primary{background:var(--orange);border-color:var(--orange);color:#fff;}
  .btn-primary:hover{background:var(--orange-dark);border-color:var(--orange-dark);}
  .btn-lg{padding:14px 22px;font-size:1rem;}
  .btn-danger{color:var(--error);border-color:#f3c2c2;} .btn-danger:hover{background:#fdecec;}
  .btn.nudge{border-color:var(--error);color:var(--error);}
  .filters{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0;}

  .runner-prog{margin-bottom:10px;font-size:.85rem;}
  .qcard{max-width:100%;}
  .qtags{font-size:.78rem;margin-bottom:8px;}
  .qstem{font-size:1.08rem;line-height:1.5;margin-bottom:16px;font-weight:600;}
  .opts{display:flex;flex-direction:column;gap:10px;}
  .opt{text-align:left;background:var(--n50);border:1.5px solid var(--n200);border-radius:10px;padding:12px 14px;cursor:pointer;font-size:.95rem;font-family:var(--font);color:var(--navy);}
  .opt:hover{border-color:var(--slate);}
  .opt.picked{border-color:var(--orange);background:#fff5ec;}
  .opt.correct{border-color:var(--success);background:#ecfdf5;}
  .opt.wrong{border-color:var(--error);background:#fef2f2;}
  .conf{display:flex;align-items:center;gap:8px;margin:16px 0 4px;}
  .conf-label{font-size:.85rem;}
  .conf-btn{border:1px solid var(--n300);background:#fff;border-radius:99px;padding:5px 12px;font-size:.8rem;cursor:pointer;text-transform:capitalize;}
  .conf-btn.on{background:var(--navy);color:#fff;border-color:var(--navy);}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;}
  .feedback{margin-top:16px;} .feedback:empty{margin:0;}
  .feedback.ok .fb-head{color:var(--success);} .feedback.no .fb-head{color:var(--error);}
  .fb-head{font-family:var(--font-head);font-weight:700;font-size:1.05rem;margin-bottom:8px;}
  .fb-line{margin:6px 0;line-height:1.5;} .fb-label{font-weight:700;}
  .order-answer{margin-top:12px;padding:10px;background:#ecfdf5;border-radius:8px;font-size:.9rem;}

  .flashcard{text-align:center;min-height:220px;display:flex;flex-direction:column;justify-content:center;}
  .fc-front{font-size:1.2rem;font-weight:600;line-height:1.5;}
  .fc-back{margin-top:16px;padding-top:16px;border-top:1px dashed var(--n300);}
  .fc-back-text{font-size:1.05rem;line-height:1.55;color:var(--n700);}
  .flashcard .actions{justify-content:center;}
  .rate-again{color:var(--error);border-color:#f3c2c2;} .rate-hard{color:var(--warning);border-color:#f6ddb0;} .rate-good{color:var(--success);border-color:#a7e8cf;}

  .guide-list{display:grid;gap:12px;} .guide-item{text-align:left;background:#fff;border:1px solid var(--n200);border-radius:var(--radius);padding:16px;cursor:pointer;box-shadow:var(--shadow);}
  .guide-item:hover{border-color:var(--orange);} .gi-title{font-family:var(--font-head);font-weight:700;font-size:1.05rem;}
  .guide-body{background:#fff;border:1px solid var(--n200);border-radius:var(--radius);padding:20px;margin-top:14px;line-height:1.6;box-shadow:var(--shadow);}
  .guide-body h3{margin-top:22px;color:var(--orange-dark);} .guide-body ul{padding-left:20px;} .guide-body li{margin:5px 0;}
  .guide-note{background:var(--n50);border-left:3px solid var(--orange);padding:10px 14px;border-radius:6px;}
  .guide-diagram{background:var(--navy);color:#d7e0e6;padding:16px;border-radius:8px;overflow-x:auto;font-family:Consolas,Monaco,monospace;font-size:.8rem;line-height:1.4;}
  .guide-h2{margin:14px 0 4px;}

  .section{margin:22px 0;} .section-h{font-size:1.1rem;margin-bottom:12px;border-bottom:2px solid var(--n200);padding-bottom:6px;}
  .dbar{margin:10px 0;} .dbar-lab{font-size:.9rem;margin-bottom:5px;} .dbar-name{font-weight:600;}
  .streak-grid{display:grid;grid-template-columns:repeat(15,1fr);gap:4px;max-width:420px;}
  .streak-cell{aspect-ratio:1;background:var(--n200);border-radius:3px;} .streak-cell.on{background:var(--orange);}
  .mock-cfg{margin:14px 0;} .mock-row{padding:6px 0;} .mock-pct{font-family:var(--font-head);font-weight:700;font-size:1.05rem;}
  .timer{background:var(--navy);color:#fff;font-family:var(--font-head);font-weight:700;text-align:center;padding:8px;border-radius:8px;margin-bottom:12px;}
  .timer.warn{background:var(--error);}
  .done{text-align:center;} .done-score{font-family:var(--font-head);font-weight:700;font-size:2.2rem;margin:10px 0 4px;}
  .breakdown{margin:14px 0;text-align:left;} .bd-row{display:flex;align-items:center;gap:10px;margin:6px 0;} .bd-dom{font-weight:700;min-width:34px;}
  .export-area{margin-top:12px;} .export-ta{width:100%;height:140px;font-family:Consolas,monospace;font-size:.75rem;border:1px solid var(--n300);border-radius:8px;padding:10px;}

  @media(max-width:520px){ .kpi-val{font-size:1.6rem;} #view{padding:16px 12px 50px;} }
</style>
</head>
<body>
  <header>
    <img src="compass-logo-white.svg" alt="Compass" onerror="this.style.display='none'"/>
    <div>
      <div class="app-title">AI-103 Study App</div>
      <div class="app-sub">Developing AI Apps &amp; Agents on Azure</div>
    </div>
  </header>
  <nav id="nav"></nav>
  <main id="view"></main>

  <script src="data.js"></script>
  <script src="content.js"></script>
  <script src="store.js"></script>
  <script src="app.js"></script>
</body>
</html>
